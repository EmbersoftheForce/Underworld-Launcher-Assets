name: Build Manifest and Publish Release

on:
  push:
    branches: [ main ]
    paths:
      - 'files/**'
      - 'config.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate manifest.json
        id: build_manifest
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("config.json", encoding="utf-8")).get("client_version", "v1.0.0"))')
          TAG="${VERSION}-b${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          export BASE_URL

          python3 - << 'EOF'
          import hashlib, json, os

          with open("config.json", "r", encoding="utf-8") as f:
              cfg = json.load(f)

          base_url = os.environ["BASE_URL"]
          file_entries = []

          for root, _, filenames in os.walk("files"):
              for fname in sorted(filenames):
                  if fname.startswith("."):
                      continue
                  fpath = os.path.join(root, fname)
                  rel_path = os.path.relpath(fpath, "files").replace("/", "\\")

                  sha256 = hashlib.sha256()
                  with open(fpath, "rb") as fp:
                      for chunk in iter(lambda: fp.read(81920), b""):
                          sha256.update(chunk)

                  file_entries.append({
                      "name": rel_path,
                      "sha256": sha256.hexdigest().lower(),
                      "url": f"{base_url}/{fname}"
                  })

          manifest = {
              "server_ip": cfg["server_ip"],
              "server_port": cfg["server_port"],
              "status_port": cfg.get("status_port", 44455),
              "exe_name": cfg["exe_name"],
              "client_version": cfg.get("client_version", "v1.0.0"),
              "discord_url": cfg.get("discord_url", ""),
              "website_url": cfg.get("website_url", ""),
              "custom_tres": cfg["custom_tres"],
              "patch_notes": cfg.get("patch_notes", []),
              "files": file_entries
          }

          with open("manifest.json", "w", encoding="utf-8") as out:
              json.dump(manifest, out, indent=2)
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.build_manifest.outputs.tag }}"
          name: "${{ steps.build_manifest.outputs.version }} (Build #${{ github.run_number }})"
          body: "Automated client release for ${{ steps.build_manifest.outputs.version }}."
          files: |
            manifest.json
            files/**/*